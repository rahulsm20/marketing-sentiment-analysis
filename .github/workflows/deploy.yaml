name: Deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        type: choice
        required: true
        default: all
        options:
          - all
          - scheduler
          - generation-service
          - embedding-service
          - chat
          - scraper
          - client

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    strategy:
      matrix:
        service:
          - name: scheduler
            dockerfile: Dockerfile.scheduler
            image: scheduler
          - name: generation-service
            dockerfile: Dockerfile.generation
            image: generation-service
          - name: embedding-service
            dockerfile: Dockerfile.embedding
            image: embedding-service
          - name: chat
            dockerfile: Dockerfile.chat
            image: chat
          - name: scraper
            dockerfile: Dockerfile.scraper
            image: scraper
          - name: client
    env:
      SELECTED: ${{ github.event.inputs.service == 'all' || github.event.inputs.service == matrix.service.name }}
      VITE_CLIENT_URL: ${{ secrets.VITE_CLIENT_URL }}
      VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
      VITE_GENERATION_SERVICE_URL: ${{ secrets.VITE_GENERATION_SERVICE_URL }}
      VITE_SCRAPING_SERVICE_URL: ${{ secrets.VITE_SCRAPING_SERVICE_URL }}
      VITE_SCHEDULER_SERVICE_URL: ${{ secrets.VITE_SCHEDULER_SERVICE_URL }}
      VITE_CHAT_SERVICE_URL: ${{ secrets.VITE_CHAT_SERVICE_URL }}
      VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
      VITE_NODE_ENV: ${{ secrets.VITE_NODE_ENV }}
    steps:
      - id: skip_check
        if: env.SELECTED == 'true'
        uses: fkirc/skip-duplicate-actions@master
      - name: Checkout repository
        if: env.SELECTED == 'true'
        uses: actions/checkout@v6

      - name: Deploy client
        if: env.SELECTED == 'true' && matrix.service.name=='client'
        run: |
          cd client
          npm install -g vercel

          vercel pull \
          --yes \
          --environment=production \
          --token=${{ secrets.VERCEL_TOKEN }} \
          --scope=${{ secrets.VERCEL_ORG_ID }}

          vercel build \
          --prod \
          --token=${{ secrets.VERCEL_TOKEN }}

          vercel deploy \
          --prebuilt \
          --prod \
          --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_CLIENT_URL: ${{ secrets.VITE_CLIENT_URL }}
          VITE_SERVER_URL: ${{secrets.VITE_SERVER_URL}}
          VITE_GENERATION_SERVICE_URL: ${{secrets.VITE_GENERATION_SERVICE_URL}}
          VITE_SCRAPING_SERVICE_URL: ${{secrets.VITE_SCRAPING_SERVICE_URL}}
          VITE_SCHEDULER_SERVICE_URL: ${{secrets.VITE_SCHEDULER_SERVICE_URL}}
          VITE_CHAT_SERVICE_URL: ${{secrets.VITE_CHAT_SERVICE_URL}}
          VITE_AUTH0_AUDIENCE: ${{secrets.VITE_AUTH0_AUDIENCE}}
          VITE_NODE_ENV: ${{ secrets.VITE_NODE_ENV }}

      - name: Authenticate to GCP
        if: env.SELECTED == 'true' && matrix.service.name!='client'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configure Docker
        if: env.SELECTED == 'true' && matrix.service.name!='client'
        run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        if: env.SELECTED == 'true' && matrix.service.name!='client'
        run: |
          docker build -f ${{ matrix.service.dockerfile }} \
            --platform linux/amd64 \
            -t us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/marketing-sentiment-analysis/${{ matrix.service.image }}:latest . && \
          docker push us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/marketing-sentiment-analysis/${{ matrix.service.image }}:latest

      - name: Deploy to Cloud Run
        if: env.SELECTED == 'true' && matrix.service.name!='client'
        run: |
          gcloud run deploy ${{ matrix.service.name }} \
            --image us-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/marketing-sentiment-analysis/${{ matrix.service.image }}:latest \
            --region us-west1 \
            --platform managed \
            --allow-unauthenticated
