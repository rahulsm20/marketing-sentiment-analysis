openapi: 3.1.0
info:
  title: Storage Service API
  version: 1.0.0

servers:
  - url: http://localhost:4006
    description: Storage Service

paths:
  /file:
    post:
      summary: Upload file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadFileRequest"
      responses:
        "201":
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
  /file/{id}:
    get:
      summary: Get a file by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "404":
          description: Not found
components:
  schemas:
    File:
      type: object
      required: [message, url]
      properties:
        message:
          type: string
        url:
          type: string
          format: uri

    UploadFileRequest:
      type: object
      required: [filename, filetype, data]
      properties:
        filename:
          type: string
        filetype:
          type: string
        data:
          type: string
          format: binary
